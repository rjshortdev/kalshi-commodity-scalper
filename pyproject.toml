[project]
name = "kalshi-commodity-scalper"
version = "0.2.0"
description = "Small book-only Kalshi commodities trend bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Live orders only. Public market data and dry runs use the standard library.
    "cryptography>=42.0",
]

[project.scripts]
kalshi-scalper = "kalshi_commodity_scalper.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_commodity_scalper"]
